<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>הספרייה שלי</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=4" />
  </head>
  <body>
    <div id="gate" class="wrap gate" hidden>
      <p class="eyebrow">פרופיל לכל קורא</p>
      <h1>מי קורא עכשיו?</h1>
      <p class="lede">לכל משתמש הספרים שלו. השם יכול להיות בעברית, והסיסמה יכולה להיות פשוטה, גם 123.</p>
      <div id="user-list" class="user-list"></div>
      <form id="auth-form" class="auth-form">
        <label>
          שם משתמש
          <input id="username" name="username" autocomplete="username" required />
        </label>
        <label>
          סיסמה
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="auth-error" class="auth-error"></p>
        <div class="auth-actions">
          <button type="submit" class="view-btn is-on">כניסה</button>
          <button type="button" id="register" class="view-btn">משתמש חדש</button>
        </div>
      </form>
      <p id="legacy-note" class="hint" hidden>המשתמש הראשון שייווצר יקבל את הספרים שכבר סומנו במחשב הזה.</p>
    </div>
    <div id="library" class="wrap" hidden>
      <header class="top">
        <div class="who-row">
          <p class="eyebrow" id="who">שלום</p>
          <div class="top-actions">
            <button type="button" id="layout" class="layout-btn" aria-pressed="false">
              <span>סוג תצורה</span>
              <small id="layout-mode">תצוגה ראשונה</small>
            </button>
            <button type="button" id="logout" class="logout">יציאה</button>
          </div>
        </div>
        <h1>הספרייה שלי</h1>
        <p class="lede">למעלה הספרים שלקחתם ועודם אצלכם. מתחת, ספרים שעוד לא קראתם ושמתאימים למה שאהבתם.</p>
        <nav class="views" aria-label="מעבר בין מסכים">
          <button type="button" class="view-btn is-on" data-view="home">
            <span class="view-title">אצלי עכשיו</span>
            <span class="view-sub">מהספרייה, והמלצות</span>
          </button>
          <button type="button" class="view-btn" data-view="read">
            <span class="view-title">ספרים שקראתי</span>
            <span class="view-sub" id="read-count">לייק ודיסלייק</span>
          </button>
        </nav>
        <label class="search">
          <span>חיפוש בקטלוג</span>
          <input id="q" type="search" placeholder="שם ספר או מחבר" autocomplete="off" />
        </label>
        <p class="profile" id="profile"></p>
      </header>
      <main id="app"></main>
    </div>
    <script src="/app.js?v=4"></script>
  </body>
</html>
